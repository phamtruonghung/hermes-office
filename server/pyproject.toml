[project]
name = "hermes-office-mcp"
version = "0.1.0"
description = "Minimal MCP server that drives headless LibreOffice for document conversion, PDF preview and merge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "phamtruonghung" }]
dependencies = [
    "mcp>=1.30.0,<2",
    "markdown>=3.7",
]

[project.scripts]
hermes-office-mcp = "hermes_office_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_office_mcp"]
